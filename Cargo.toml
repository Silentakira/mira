[package]
name = "mira"
version = "0.1.0"
edition = "2021"

[lib]
name = "mira_lib"
path = "src-tauri/src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mira"
path = "src-tauri/src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# OAuth2 — manual implementation via reqwest (no google-authz crate needed)
# Email
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
async-native-tls = "0.5"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-native-tls", "hostname"] }
mailparse = "0.15"
# Gemini AI
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Keychain / secure storage
keyring = { version = "3", features = ["apple-native"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# UUID
uuid = { version = "1", features = ["v4"] }
# URL encoding
urlencoding = "2"
base64 = "0.22"
webbrowser = "1"
log = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
