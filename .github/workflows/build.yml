name: Build Mira — macOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  MIRA_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  MIRA_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  build-macos:
    name: Build & Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build Tauri app
        run: cargo build --release
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'

      - name: Bundle as .app
        run: |
          mkdir -p target/release/bundle/mira.app/Contents/{MacOS,Resources}
          cp target/release/mira target/release/bundle/mira.app/Contents/MacOS/

          cat > target/release/bundle/mira.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>mira</string>
              <key>CFBundleIdentifier</key>
              <string>com.mira.mail</string>
              <key>CFBundleName</key>
              <string>Mira</string>
              <key>CFBundleDisplayName</key>
              <string>Mira</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundleIconFile</key>
              <string>icon</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          PLIST

          cp src-tauri/icons/icon.icns target/release/bundle/mira.app/Contents/Resources/
          cp -r src/* target/release/bundle/mira.app/Contents/Resources/

      - name: Create DMG
        run: |
          brew install create-dmg 2>/dev/null || true
          create-dmg \
            --volname "Mira" \
            --volicon "target/release/bundle/mira.app/Contents/Resources/icon.icns" \
            --background "src-tauri/icons/128x128.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Mira.app" 175 185 \
            --hide-extension "Mira.app" \
            --skip-jenkins \
            "target/release/Mira-0.1.0.dmg" \
            "target/release/bundle/mira.app" 2>/dev/null || true

          if [ ! -f "target/release/Mira-0.1.0.dmg" ]; then
            cd target/release/bundle
            zip -r ../../Mira-0.1.0-macos.zip mira.app
            cd ../..
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira-macos-${{ github.sha }}
          path: |
            target/release/Mira-0.1.0.dmg
            target/release/Mira-0.1.0-macos.zip
          retention-days: 30

      - name: Release (on tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/Mira-0.1.0.dmg
            target/release/Mira-0.1.0-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
